# Release: on every push to main, first require reusable tests and product validation.
# Publication rechecks evidence and remote main at each stage; serialization alone
# cannot make Git and GitHub into one atomic transaction.
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.repository }}-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  publish:
    needs: validation
    if: needs.validation.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 — we need full history and tags to check whether v$V already
      # exists and to push a new tag from this commit.
      # Verified 2026-09-15 against the official upstream release:
      # https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Publish verified candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: 'github-actions[bot]'
          GIT_AUTHOR_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
          GIT_COMMITTER_NAME: 'github-actions[bot]'
          GIT_COMMITTER_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
        run: node scripts/release-publication.mjs --source "$GITHUB_SHA"
